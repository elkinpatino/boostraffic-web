server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /privacy.html { return 301 /politica-de-privacidad/; }
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=3600, must-revalidate"; add_header X-Content-Type-Options nosniff always; }
    location ~* \.(webp|png|ico|jpg|jpeg|svg|woff2)$ { expires 30d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}
